<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">David Ciulla  Tokyo · Laravel Japan community builder</title>
  <desc id="desc">Frontier-style profile banner for David Ciulla, lead engineer in Tokyo.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--sky)"/>
      <stop offset="55%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--bg)"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width="0.6"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <style>
      :root {
        --bg: #faf9f6;
        --sky: #e8f0f5;
        --ink: #1c1c1e;
        --muted: #5c6570;
        --ai: #2e4a62;
        --shu: #c45c3e;
        --line: #2e4a6222;
        --card: #ffffffcc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1419;
          --sky: #1a2430;
          --ink: #e8ecf1;
          --muted: #9aa7b4;
          --ai: #8cb4d4;
          --shu: #e8896f;
          --line: #8cb4d428;
          --card: #1c2430e6;
        }
      }
      .hud { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 0.18em; }
      .display { font-family: ui-sans-serif, Inter, system-ui, sans-serif; }
      .pulse { transform-origin: 24px 24px; }
      @media (prefers-reduced-motion: no-preference) {
        .dash { stroke-dasharray: 6 10; animation: crawl 14s linear infinite; }
        .pulse { animation: pulse 3.6s ease-in-out infinite; }
        .orb { animation: drift 9s ease-in-out infinite; }
      }
      @keyframes crawl { to { stroke-dashoffset: -160; } }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @keyframes drift { 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#wash)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" filter="url(#grain)"/>

  <g fill="var(--ai)" opacity="0.55">
    <circle cx="980" cy="86" r="1.6"/>
    <circle cx="1048" cy="128" r="1.3"/>
    <circle cx="1112" cy="78" r="1.8"/>
    <circle cx="1074" cy="188" r="1.2"/>
    <circle cx="1146" cy="156" r="1.5"/>
    <circle cx="1008" cy="214" r="1.1"/>
  </g>
  <g stroke="var(--ai)" stroke-width="0.6" opacity="0.28" fill="none">
    <path d="M980 86 L1048 128 L1112 78 L1074 188 L1008 214"/>
  </g>

  <g class="orb" fill="none" stroke="var(--ai)" stroke-width="1.2">
    <circle cx="1048" cy="250" r="54" opacity="0.35"/>
    <circle cx="1048" cy="250" r="78" class="dash" opacity="0.45"/>
    <circle cx="1048" cy="250" r="8" fill="var(--shu)" stroke="none"/>
  </g>

  <rect x="28" y="22" width="1144" height="36" rx="6" fill="var(--card)" stroke="var(--ai)" stroke-opacity="0.22"/>
  <circle class="pulse" cx="48" cy="40" r="5" fill="var(--shu)"/>
  <text class="hud" x="66" y="45" fill="var(--ai)" font-size="12">Æ FRONTIER // POD LINK ACTIVE</text>
  <text class="hud" x="1148" y="45" fill="var(--muted)" font-size="11" text-anchor="end">q¬ · 35.68N</text>

  <text class="hud" x="40" y="108" fill="var(--shu)" font-size="13">UNIT / OFFSKIP-DAVE</text>
  <text class="display" x="36" y="168" fill="var(--ink)" font-size="58" font-weight="700">David Ciulla</text>
  <text class="display" x="38" y="208" fill="var(--ai)" font-size="22">Lead engineer · advisor on demand · Laravel Japan community builder</text>
  <text class="display" x="38" y="248" fill="var(--muted)" font-size="16">Building products in Tokyo. Mentoring privately. Co-organizing PHP×Tokyo and Laravel Live Japan.</text>

  <g font-family="ui-sans-serif, Inter, system-ui, sans-serif" font-size="13">
    <rect x="38" y="286" width="132" height="32" rx="16" fill="none" stroke="var(--shu)"/>
    <text x="104" y="307" text-anchor="middle" fill="var(--shu)">Laravel</text>
    <rect x="180" y="286" width="92" height="32" rx="16" fill="none" stroke="var(--ai)"/>
    <text x="226" y="307" text-anchor="middle" fill="var(--ai)">Vue</text>
    <rect x="282" y="286" width="92" height="32" rx="16" fill="none" stroke="var(--ai)"/>
    <text x="328" y="307" text-anchor="middle" fill="var(--ai)">Nuxt</text>
    <rect x="384" y="286" width="148" height="32" rx="16" fill="none" stroke="var(--ai)"/>
    <text x="458" y="307" text-anchor="middle" fill="var(--ai)">Tailwind</text>
    <rect x="542" y="286" width="92" height="32" rx="16" fill="none" stroke="var(--ai)"/>
    <text x="588" y="307" text-anchor="middle" fill="var(--ai)">Rust</text>
  </g>

  <text class="hud" x="38" y="352" fill="var(--muted)" font-size="11">LOC // TOKYO   ·   SINCE 2015 LARAVEL   ·   FROM TOKYO WITH CURIOSITY</text>
</svg>
